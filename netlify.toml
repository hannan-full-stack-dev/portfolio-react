[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Old multi-page URLs -> new React routes (keeps old links/bookmarks working)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/projects.html"
  to = "/projects"
  status = 301

[[redirects]]
  from = "/mygallery.html"
  to = "/gallery"
  status = 301

# SPA fallback: every other path serves the React app
# (this is what makes /about, /projects, /gallery work on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
